name: Audyt cytowan ustaw

# Przy kazdej zmianie tresci sprawdza, czy w repo nie pojawilo sie cytowanie
# Dz.U. spoza rejestru seuranta/ustawy.json. Wachta-legislacyjna zalezy od
# ZEWNETRZNEGO stanu ISAP i dlatego jest tylko na cron; to jest kontrola
# TRESCI REPO, wiec uruchamia sie na kazdym push/PR jak check-marketplace.
# Wzorzec: viittausauditointi (claude-for-legal-finland, MIT).

on:
  push:
    branches: [main]
    paths:
      - '**/*.md'
      - 'seuranta/ustawy.json'
      - 'scripts/audyt-cytowan-ustaw.mjs'
  pull_request:
    paths:
      - '**/*.md'
      - 'seuranta/ustawy.json'
      - 'scripts/audyt-cytowan-ustaw.mjs'
  workflow_dispatch:

jobs:
  audyt:
    runs-on: ubuntu-latest
    name: Cytowania Dz.U. vs rejestr

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Sprawdz cytowania ustaw
        run: node scripts/audyt-cytowan-ustaw.mjs
